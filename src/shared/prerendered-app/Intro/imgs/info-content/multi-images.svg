<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .image { fill: #4CAF50; stroke: #333; stroke-width: 3; }
      .compressed { fill: #2196F3; stroke: #333; stroke-width: 3; }
      .compressor { fill: #FF5722; stroke: #333; stroke-width: 3; }
      .arrow { fill: #FF9800; }
    </style>
  </defs>

  <!-- Imágenes originales en fila -->
  <rect x="50" y="20" width="80" height="60" class="image" />
  <rect x="150" y="20" width="80" height="60" class="image" />
  <rect x="250" y="20" width="80" height="60" class="image" />
  <rect x="350" y="20" width="80" height="60" class="image" />

  <!-- Flecha grande hacia el compresor -->
  <polygon points="440,50 460,60 440,70" class="arrow" />
  <line x1="460" y1="60" x2="520" y2="60" stroke="#FF9800" stroke-width="5" />

  <!-- Compresor -->
  <rect x="530" y="30" width="80" height="60" class="compressor" rx="10" />
  <text x="570" y="65" font-family="Arial" font-size="12" fill="white" text-anchor="middle">ZIP</text>

  <!-- Flecha desde compresor a comprimidas -->
  <line x1="610" y1="60" x2="660" y2="60" stroke="#FF9800" stroke-width="5" />
  <polygon points="660,50 680,60 660,70" class="arrow" />

  <!-- Imágenes comprimidas en fila inferior -->
  <rect x="30" y="120" width="60" height="45" class="compressed" />
  <rect x="100" y="120" width="60" height="45" class="compressed" />
  <rect x="170" y="120" width="60" height="45" class="compressed" />
  <rect x="240" y="120" width="60" height="45" class="compressed" />
  <rect x="310" y="120" width="60" height="45" class="compressed" />
  <rect x="380" y="120" width="60" height="45" class="compressed" />
  <rect x="450" y="120" width="60" height="45" class="compressed" />
  <rect x="520" y="120" width="60" height="45" class="compressed" />
</svg>
